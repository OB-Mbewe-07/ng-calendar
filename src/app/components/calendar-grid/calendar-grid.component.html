<div class="m-[1%] flex-1">
  <div
    class="rounded-xl overflow-hidden h-full flex flex-col"
    style="border: 1px solid var(--p-menubar-border-color)"
  >
    <div
      class="flex items-center justify-between px-6 py-4"
      style="border-bottom: 1px solid var(--p-menubar-border-color)"
    >
      <div class="flex items-center gap-3">
        <h2 class="font-bold text-xl m-0">{{ currentDate | date: 'MMMM yyyy' }}</h2>
      </div>

      <div class="flex gap-2">
        <p-button icon="pi pi-chevron-left" [text]="true" severity="secondary" size="small" />
        <p-button label="Today" [outlined]="true" size="small" severity="secondary" />
        <p-button icon="pi pi-chevron-right" [text]="true" severity="secondary" size="small" />
      </div>
    </div>

    <div class="grid grid-cols-7 text-center">
      @for (day of weekdays; track $index) {
        <div
          class="py-3 text-xs font-bold text-secondary"
          style="border-bottom: 1px solid var(--p-menubar-border-color)"
        >
          {{ day }}
        </div>
      }
    </div>

    <div class="grid grid-cols-7 flex-1">
      @for (empty of gridPadding; track $index) {
        <div
          class=""
          style="
            border-bottom: 1px solid var(--p-menubar-border-color);
            border-right: 1px solid var(--p-menubar-border-color);
          "
        ></div>
      }

      @for (day of daysInMonth; track $index) {
        <div
          class="min-h-[100px] p-3 transition-colors cursor-pointer group"
          style="
            border-bottom: 1px solid var(--p-menubar-border-color);
            border-right: 1px solid var(--p-menubar-border-color);
          "
        >
          <span class="font-semibold">
            {{ day }}
          </span>
        </div>
      }
    </div>
  </div>
</div>
