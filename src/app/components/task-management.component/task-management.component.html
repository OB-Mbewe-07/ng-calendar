<div class="card">
  <p-dataview #dv [value]="store.tasks()">
    <ng-template #list let-items>
      <div class="flex flex-col">
        @for (item of items; track item.id; let first = $first) {
          <div
            class="flex items-center justify-between px-6 py-4 gap-4"
            [ngClass]="{ 'border-t border-surface-200 dark:border-surface-700': !first }"
          >
            <div
              class="w-14 h-14 flex flex-col items-center justify-center rounded-lg bg-surface-0 dark:bg-surface-900 shrink-0"
              style="border: 1px solid var(--p-menubar-border-color)"
            >
              <span class="text-[10px] font-bold text-primary uppercase tracking-wider">
                {{ item.date | date: 'MMM' }}
              </span>
              <span class="text-lg font-bold leading-none">
                {{ item.date | date: 'dd' }}
              </span>
            </div>

            <div class="flex flex-col flex-1 min-w-0">
              <div class="text-sm font-semibold text-surface-900 dark:text-surface-0 truncate">
                {{ item.title }}
              </div>
              <div class="text-xs text-secondary mt-1">
                {{ item.date | date: 'EEEE, MMMM d' }}
              </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <p-button
                icon="pi pi-trash"
                [text]="true"
                severity="danger"
                size="small"
              />
            </div>

          </div>
        }
      </div>
    </ng-template>
  </p-dataview>
</div>
