<div class="card m-[1%]">
  <p-menubar [model]="items">
    <ng-template #start>
      <img
        src="https://img.icons8.com/?size=50&id=8Cm91HvffxFH&format=png&color=000000"
        alt="Logo"
        height="40"
        class="mr-2"
      />
      <span class="font-bold text-xl">HolidayApp</span>
    </ng-template>
    <div class="ml-auto">
        <div class=" flex gap-2">
          <p-button icon="pi pi-chevron-left" [text]="true" severity="secondary" size="small" />
          <p-button label="Today" [outlined]="true" size="small" severity="secondary" />
          <p-button icon="pi pi-chevron-right" [text]="true" severity="secondary" size="small" />
        </div>
      </div>
  </p-menubar>
</div>
